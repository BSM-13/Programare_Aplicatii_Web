<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

        #hd {
        font-variant: small-caps;
        color:magenta;
    }
     h1 {
        color: blue;
    background-color: #cccc00;
    }
    caption {
        color: #ffffcc;
        background-color: #ff9900;
    }
      body {
    background-color: #ffffcc;
    }
.center, p {
  text-align: center;
  color: red;
}

.cell{
  background-color: magenta;
  text-align: center;
}

.cell1{
  background-color: orange;
  width:33%;
}



</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"
</p> 
<table style="width:100%;background-color: green;">
<caption style="font-size: xx-large;">Echipe si hobby-uri</caption>
  <tr class="cell">
    <th>Echipa</th>
	  <th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>

	<td rowspan="3" class="cell">Munte</td>
    
  <td class="cell1">Popescu</td>
  
  <td class="cell1">calatorii</td>
  
  <td class="cell1">filatelie</td>
  </tr>
  <tr>
	
    <td class="cell1">Ionescu</td>
    <td class="cell1">planorism</td>
    <td class="cell1">sah</td>
  </tr>
  <tr>
    <td class="cell1">Bratu</td>
    <td class="cell1">dame</td>
    <td class="cell1">tapi</td>
  </tr>
  <tr>
	<td rowspan="4" class="cell">Mare</td>
    <td class="cell1">Georgescu</td>
    <td class="cell1">plaja</td>
    <td class="cell1">dans</td>
  </tr>
  <tr>
	
    <td class="cell1">Gigescu</td>
    <td class="cell1">surf</td>
    <td class="cell1">samba</td>
  </tr>
  <tr>
	
    <td class="cell1">Mintescu</td>
    <td class="cell1">politica</td>
    <td class="cell1">delicateturi</td>
  </tr>
  <tr>
    <td class="cell1">Petrica</td>
    <td class="cell1">doarme</td>
    <td class="cell1">calatoreste cand doarme</td>
  </tr>
</table>
</body>
</html>
