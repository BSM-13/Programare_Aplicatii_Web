<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex6 - Contor</title>


<script>
    var contor = 0;
    
    function toggleLight(){
        var img = document.getElementById('imag');
        if(img.src.match("Bec_stins.gif")){
            contor++;
            img.src = "Bec_aprins.gif"
            document.getElementById('h').innerHTML = "Becul a fost aprins de " + contor + " ori";  
        }
        else{
            img.src = "Bec_stins.gif"
        }
    }






</script>





</head>
<body>
    <h1 id = 'h'>Becul a fost aprins de 0 ori.</h1>


    <p>


        <img id = "imag" src="Bec_stins.gif" width="100" height="180" onclick=toggleLight()>
        
        </p>
        
        




</body>
</html>
