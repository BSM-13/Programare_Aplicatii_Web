<!DOCTYPE html>
<html>
<head>
<title>Modificari paragrafe</title>
<script>
    function changeElem(){
        var p1 = document.getElementById('p1')
        var p2 = document.getElementById('p2')
        var p3 = document.getElementById('p3')

        if(p1.style.color !== 'brown'){

        p1.style.color = 'brown';
        p1.style.backgroundColor = 'red';
        p1.innerHTML = "Acesta este paragraful 1";


        p2.style.color = 'white';
        p2.style.backgroundColor = 'hotpink'
        p2.innerHTML = "Acesta este paragraful 2";



        p3.style.color = 'cream';
        p3.style.backgroundColor = 'magenta';
        p3.innerHTML = "Acesta este paragraful 3";

    }
    else{

        p1.style.color = 'black';
        p1.style.backgroundColor = 'white';
        
        p2.style.color = 'black';
        p2.style.backgroundColor = 'white';
        p3.style.color = 'black';
        p3.style.backgroundColor = 'white';
        
        
        
        p1.innerHTML = "Acesta este un paragraf";
        p2.innerHTML = "Si acesta este un paragraf";
        p3.innerHTML = "Acesta este inca un paragraf";
    }
    }
</script>






</head>
<body>

<h1>Modificari paragrafe la click pe buton</h1>

<p id = 'p1'>Acesta este un paragraf</p>

<p id = 'p2'>Si acesta este un paragraf</p>

<p id = 'p3'>Acesta este inca un paragraf</p>

<button type="button" onclick=changeElem() >Apasa-ma!</button>

</body>
</html>
