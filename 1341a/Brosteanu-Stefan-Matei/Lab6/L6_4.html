<!DOCTYPE html>
<html>
  <head>
    <title>Modificare folosind clase</title>
  </head>
  <body>
    <h1>
      Utilizati Javascript si HTML DOM pentru a inlocui imaginile de mai jos asa
      cum este indicat in textele de deasupra lor
    </h1>
    <label id="0">Pisici</label>
    <hr />
    <img
      class="animal"
      src="pesti.jpg"
      alt="Niste pesti"
      width="160"
      height="120"
    />
    <br />
    <br />
    <label id="2">Munti</label>
    <hr />
    <img
      class="peisaj"
      src="desert.jpg"
      alt="O jungla"
      width="160"
      height="120"
    />
    <br />
    <br />
    <label id="1">Caini</label>
    <hr />
    <img
      class="animal"
      src="egrete.jpg"
      alt="Niste egrete"
      width="160"
      height="120"
    />
    <br />
    <br />
    <label id="3">Mare</label>
    <hr />
    <img
      class="peisaj"
      src="jungla.jpg"
      alt="Un desert"
      width="160"
      height="120"
    />

    <script>
      var animals = document.getElementsByClassName("animal");
      var peisaje = document.getElementsByClassName("peisaj");

      for (i = 0; i < animals.length; i++) {
        animals[i].src = `./Img/${document.getElementById(i).innerText}.jpg`;
      }

      for (i = 0; i < peisaje.length; i++) {
        peisaje[i].src = `./Img/${
          document.getElementById(i + 2).innerText
        }.jpg`;
      }
    </script>
  </body>
</html>
